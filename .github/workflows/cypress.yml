name: Cypress Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        uses: cypress-io/github-action@v6

        with:
          record: true

        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESSWALKDOGKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
